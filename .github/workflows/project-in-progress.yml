# Reusable: pindahkan kartu issue ke "In progress" saat cabang dibuat.
# Nama cabang wajib memuat nomor issue: <tipe>/<nomor>-<slug>, contoh feat/12-login.
name: project-in-progress

on:
  workflow_call:
    secrets:
      PROJECT_TOKEN:
        required: true

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Pindahkan ke In progress
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          num=$(echo "$BRANCH" | sed -nE 's#^[A-Za-z0-9_-]+/([0-9]+)[-_].*#\1#p')
          if [ -z "$num" ]; then echo "Cabang $BRANCH tanpa nomor issue, lewati."; exit 0; fi
          owner=${REPO%%/*}; name=${REPO##*/}
          data=$(gh api graphql -f query='
            query($o:String!,$n:String!,$i:Int!){
              repository(owner:$o,name:$n){ issue(number:$i){ id state
                projectItems(first:10){ nodes{ id project{ id number } } } } } }' \
            -f o="$owner" -f n="$name" -F i="$num")
          if [ "$(echo "$data" | jq -r '.data.repository.issue.state')" != "OPEN" ]; then echo "Issue #$num tidak terbuka, lewati."; exit 0; fi
          item=$(echo "$data" | jq -r '.data.repository.issue.projectItems.nodes[]|select(.project.number==5)|.id' | head -1)
          proj=$(echo "$data" | jq -r '.data.repository.issue.projectItems.nodes[]|select(.project.number==5)|.project.id' | head -1)
          if [ -z "$item" ]; then echo "Issue #$num belum ada di Project 5, lewati."; exit 0; fi
          meta=$(gh api graphql -f query='
            query($p:ID!){ node(id:$p){ ... on ProjectV2 { field(name:"Status"){ ... on ProjectV2SingleSelectField { id options{ id name } } } } } }' -f p="$proj")
          field=$(echo "$meta" | jq -r '.data.node.field.id')
          opt=$(echo "$meta" | jq -r '.data.node.field.options[]|select(.name|test("^In [Pp]rogress$"))|.id')
          gh api graphql -f query='
            mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){ updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){ projectV2Item{ id } } }' \
            -f p="$proj" -f i="$item" -f f="$field" -f o="$opt" >/dev/null
          echo "Issue #$num dipindah ke In progress."
